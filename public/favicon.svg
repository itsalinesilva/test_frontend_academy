<!--
  Conservatório Muscicapa — marca reduzida.

  Não é o brasão. É a redução dele para 16px, onde três pássaros, duas armas
  cruzadas e a moldura de volutas viram uma mancha ilegível.

  O que sobrevive à redução é o que identifica: o escudo anil, a abelha em
  ouro no alto — o alvo — e o Cruzeiro do Sul no campo. Bee e Crux mantêm a
  leitura do conceito (a captura, o sul) sem tentar caber o que não cabe.

  Provisória e editável: quando houver uma redução oficial desenhada a partir
  do brasão, ela substitui este arquivo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Conservatório Muscicapa">
  <!-- Escudo -->
  <path
    d="M16 2.2 27 5.4v11.1c0 6.1-4.4 11-11 13.3-6.6-2.3-11-7.2-11-13.3V5.4z"
    fill="#1d2f49"
    stroke="#7b6947"
    stroke-width="1.4"
  />

  <!-- Abelha: o alvo. Corpo, listras e asas. -->
  <g fill="#cdc1ad">
    <ellipse cx="16" cy="10.4" rx="1.75" ry="2.5" />
  </g>
  <g stroke="#1d2f49" stroke-width="0.62" stroke-linecap="round">
    <line x1="14.5" y1="10" x2="17.5" y2="10" />
    <line x1="14.6" y1="11.4" x2="17.4" y2="11.4" />
  </g>
  <g fill="#b5a17d" opacity="0.92">
    <ellipse cx="13.5" cy="9" rx="1.7" ry="0.95" transform="rotate(-26 13.5 9)" />
    <ellipse cx="18.5" cy="9" rx="1.7" ry="0.95" transform="rotate(26 18.5 9)" />
  </g>

  <!--
    Cruzeiro do Sul — cinco estrelas.
    Alfa (pé, a mais brilhante) embaixo, Gama (cabeça) em cima, Beta e Delta
    nos braços, Épsilon deslocada do eixo. As magnitudes viram tamanhos.
  -->
  <g fill="#ffffff">
    <circle cx="16.0" cy="24.2" r="1.15" />
    <circle cx="16.4" cy="17.2" r="0.92" />
    <circle cx="19.3" cy="20.3" r="0.88" />
    <circle cx="13.2" cy="20.0" r="0.72" />
    <circle cx="17.6" cy="21.4" r="0.48" />
  </g>
</svg>
