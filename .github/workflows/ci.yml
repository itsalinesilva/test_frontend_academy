name: CI Foundation Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src server functions --ext .ts,.tsx

      - name: Run Test Suite
        run: npm run test

      - name: Build Production Assets
        run: npx tsc && npx vite build

      # Guarda de release: falha se a allowlist administrativa ou qualquer
      # segredo de servidor aparecer no artefato do cliente (CLAUDE_AUDIT.md S-02).
      - name: Verify No Secret Leaked Into Client Bundle
        run: npm run verify:secrets
        env:
          ADMIN_ALLOWLIST: ${{ secrets.ADMIN_ALLOWLIST }}
          SESSION_SIGNING_SECRET: ${{ secrets.SESSION_SIGNING_SECRET }}
          AUDIT_SIGNING_SECRET: ${{ secrets.AUDIT_SIGNING_SECRET }}
